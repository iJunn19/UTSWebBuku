<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      Tracking Pengiriman Buku - PustakaKopi | UTS Pemrograman Web 1
    </title>

    <!-- CSS External Utama -->
    <link rel="stylesheet" href="css/style.css" />

    <!-- CSS Internal: Gaya khusus pencarian tracking -->
    <style>
      .tracking-search-card {
        background: #ffffff;
        border: 1px solid var(--border-color);
        border-radius: var(--radius-xl);
        padding: 2.5rem 2rem;
        box-shadow: var(--shadow-sm);
        text-align: center;
        max-width: 750px;
        margin: 0 auto 2.5rem auto;
      }
      .tracking-form {
        display: flex;
        gap: 0.75rem;
        max-width: 550px;
        margin: 1.5rem auto 1rem auto;
      }
      .sample-chips {
        display: flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 0.5rem;
        font-size: 0.825rem;
        color: var(--text-muted);
      }
      .chip-btn {
        background: var(--bg-subtle);
        border: 1px solid var(--border-color);
        border-radius: var(--radius-full);
        padding: 0.25rem 0.75rem;
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--coffee-espresso);
        cursor: pointer;
        transition: all 0.2s ease;
      }
      .chip-btn:hover {
        background: var(--coffee-latte);
        border-color: var(--coffee-medium);
      }
      @media (max-width: 600px) {
        .tracking-form {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <!-- Top Announcement Bar
  <div class="top-notice-bar">
    🚚 <strong>Layanan Pelacakan DO</strong> &bull; Pantau ekspedisi dan estimasi pengiriman paket buku Anda
  </div> -->

    <!-- Main Navigation Bar -->
    <header class="main-header">
      <div class="container">
        <nav class="navbar">
          <a href="dashboard.html" class="brand-logo">
            <div class="brand-icon">☕</div>
            <span>Pustaka<span style="color: #8b5a36">Kopi</span></span>
          </a>

          <!-- Mobile Toggle Button -->
          <button
            id="navToggleBtn"
            class="nav-toggle-btn"
            aria-label="Menu Navigasi"
          >
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <line x1="3" y1="12" x2="21" y2="12"></line>
              <line x1="3" y1="6" x2="21" y2="6"></line>
              <line x1="3" y1="18" x2="21" y2="18"></line>
            </svg>
          </button>

          <ul id="mainNavMenu" class="nav-menu">
            <li><a href="dashboard.html" class="nav-link">Dashboard</a></li>
            <li><a href="stok.html" class="nav-link">Katalog &amp; Stok</a></li>
            <li><a href="checkout.html" class="nav-link">Pemesanan</a></li>
            <li>
              <a href="tracking.html" class="nav-link active">Tracking DO</a>
            </li>
          </ul>

          <div class="nav-actions">
            <div class="user-badge">
              <span class="user-badge-avatar">👤</span>
              <span id="userNameDisplay">Admin</span>
            </div>
            <button onclick="logoutUser()" class="btn btn-outline btn-sm">
              Logout
            </button>
          </div>
        </nav>
      </div>
    </header>

    <!-- Content Tracking -->
    <main class="container" style="padding-top: 2.5rem; padding-bottom: 4rem">
      <!-- Hero Box Pencarian Tracking DO (Sesuai Soal No. 5) -->
      <div class="tracking-search-card">
        <div
          style="
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: var(--coffee-cream);
            color: var(--coffee-espresso);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
          "
        >
          🚚
        </div>
        <h1
          style="font-size: 1.85rem; color: #2a1810; margin-bottom: 0.5rem"
          class="font-serif"
        >
          Informasi Tracking Pengiriman
        </h1>
        <p style="font-size: 0.95rem; color: #6f472d">
          Masukkan <strong>Nomor Delivery Order (DO)</strong> yang Anda dapatkan
          saat melakukan pemesanan.
        </p>

        <!-- Form Input Nomor Delivery Order -->
        <form id="formTrackingDO" class="tracking-form">
          <input
            type="text"
            id="inputNomorDO"
            class="form-control"
            placeholder="Contoh: DO-2026-001"
            value="DO-2026-001"
            required
          />
          <button
            type="submit"
            class="btn btn-primary"
            style="white-space: nowrap"
          >
            <svg
              width="18"
              height="18"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
            >
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <span>Lacak Sekarang</span>
          </button>
        </form>

        <!-- Sampel Nomor DO untuk Memudahkan Dosen Menilai -->
        <div class="sample-chips">
          <span>💡 Contoh DO Demo:</span>
          <button
            type="button"
            class="chip-btn"
            onclick="isiContohDO('DO-2026-001')"
          >
            DO-2026-001
          </button>
          <button
            type="button"
            class="chip-btn"
            onclick="isiContohDO('DO-2026-002')"
          >
            DO-2026-002
          </button>
          <button
            type="button"
            class="chip-btn"
            onclick="isiContohDO('DO-2026-003')"
          >
            DO-2026-003
          </button>
        </div>
      </div>

      <!-- Kontainer Hasil Pelacakan (Dimanipulasi Dinamis via DOM script.js) -->
      <div
        id="hasilTracking"
        style="display: none; max-width: 900px; margin: 0 auto"
      >
        <!-- Konten tracking diinjeksi via script.js lakukanPencarianDO() -->
      </div>
    </main>

    <!-- Footer -->
    <footer class="main-footer">
      <div class="container">
        <div class="footer-bottom" style="border: none; padding-top: 0">
          &copy; 2026 PustakaKopi Store &bull; UTS Pemrograman Web 1 &bull;
          Universitas Pelita Bangsa
        </div>
      </div>
    </footer>

    <!-- Helper Tambahan untuk Sampel DO -->
    <script>
      function isiContohDO(kode) {
        document.getElementById("inputNomorDO").value = kode;
        if (typeof lakukanPencarianDO === "function") {
          lakukanPencarianDO(kode);
        }
      }
    </script>

    <!-- Data Dummy & Script Logika -->
    <script src="js/data.js"></script>
    <script src="js/script.js"></script>
  </body>
</html>
